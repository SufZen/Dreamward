name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The desktop app's Electron binary is only needed to run it locally.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Versions in sync
        run: node scripts/release/sync-versions.mjs --check
      - name: Typecheck (all packages)
        run: pnpm -r typecheck
      - name: Build
        run: pnpm build
      - name: Test (incl. upgrade-compat + isolation)
        run: pnpm --filter @dreamward/api test
      - name: MCP end-to-end (real API + stdio MCP server + SDK client)
        env:
          DATA_DIR: ${{ runner.temp }}/mcp-e2e
          PORT: '4199'
          NODE_ENV: development
          JWT_SECRET: ci-mcp-e2e-secret-ci-mcp-e2e-secret
          KEY_ENCRYPTION_SECRET: ci-mcp-e2e-key-secret-123456
          DREAMWARD_EMAIL: e2e@example.com
          DREAMWARD_PASSWORD: e2e-pass-12345
          PUBLIC_ORIGIN: http://localhost:4199
          DREAMWARD_URL: http://127.0.0.1:4199
        run: |
          (cd apps/api && npx tsx src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4199/api/health && break; sleep 1; done
          node packages/mcp/scripts/e2e.mjs || { cat "$RUNNER_TEMP/api.log"; exit 1; }
      - name: Desktop engine bundle boots (desktop mode, served web app, local session)
        env:
          NODE_ENV: production
          DESKTOP_MODE: 'true'
          DESKTOP_TOKEN: ci-desktop-token-ci-desktop-token-0123456789
          PORT: '4299'
          PUBLIC_ORIGIN: http://127.0.0.1:4299
          DATA_DIR: ${{ runner.temp }}/desktop/data
          BACKUP_DIR: ${{ runner.temp }}/desktop/backups
          WEB_DIST_DIR: ${{ github.workspace }}/apps/desktop/dist/web
          MIGRATIONS_DIR: ${{ github.workspace }}/apps/desktop/dist/api/drizzle
          JWT_SECRET: ci-desktop-jwt-secret-ci-desktop-jwt-secret-0123
          KEY_ENCRYPTION_SECRET: ci-desktop-key-secret-0123456789
        run: |
          (cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/apps/desktop/dist/api/start.mjs" > "$RUNNER_TEMP/desktop.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4299/api/health | grep -q '"desktop":true' && break; sleep 1; done
          fail() { echo "::error::$1"; cat "$RUNNER_TEMP/desktop.log"; exit 1; }
          curl -fsS http://127.0.0.1:4299/api/health | grep -q "\"version\":\"$(node -p "require('./package.json').version")\"" || fail "wrong version in bundle"
          cookie=$(curl -fsS -D - -o /dev/null -X POST -H "x-desktop-token: $DESKTOP_TOKEN" http://127.0.0.1:4299/api/desktop/session | grep -io 'lb_session=[^;]*') || fail "no session"
          curl -fsS -H "cookie: $cookie" http://127.0.0.1:4299/api/categories | grep -q health_fitness || fail "book not provisioned"
          curl -fsS http://127.0.0.1:4299/ikigai | grep -q '<div id="root">' || fail "web app not served"

  # Builds both images and boots the stack exactly as self-hosters will.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t dreamward-api:ci .
          docker build -f apps/web/Dockerfile -t dreamward-web:ci .
      - name: Boot & health check
        run: |
          docker network create lb
          docker run -d --name api --network lb \
            -e NODE_ENV=production -e COOKIE_SECURE=true \
            -e JWT_SECRET=$(openssl rand -hex 32) -e KEY_ENCRYPTION_SECRET=$(openssl rand -hex 32) \
            -e DREAMWARD_EMAIL=ci@example.com -e DREAMWARD_PASSWORD=ci-password-123 \
            dreamward-api:ci
          docker run -d --name web --network lb -p 8080:80 dreamward-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"ok":true'; then exit 0; fi
            sleep 2
          done
          docker logs api; exit 1
      - name: Admin CLI works inside the image
        run: docker exec api node dist/scripts/admin.js status

  # Rolling "edge" images from main for testers (never :latest).
  edge-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/dreamward-${{ matrix.app }}:edge
            ghcr.io/${{ steps.owner.outputs.owner }}/dreamward-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
