name: PR title

# PR titles become the squash-commit subject, which release-please reads to
# decide the next version and write the CHANGELOG. Enforce Conventional Commits.
#
# `pull_request` (not `pull_request_target`) so it also runs on the release
# bot's PRs, which are opened with GITHUB_TOKEN: the check needs only a
# read-only token and never checks out the PR's code.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            security
            docs
            refactor
            test
            build
            ci
            chore
            revert
