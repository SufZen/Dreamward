name: Release

# The release pipeline for a vX.Y.Z tag:
#   verify   → versions in sync + match the tag, typecheck, tests, build
#   images   → multi-arch (amd64 + arm64) images with SBOM + provenance
#   assets   → install.sh / docker-compose.yml (images pinned by digest) /
#              .env.example / ctl on the Release
#   checksums→ SHA256SUMS over every Release asset (the installer verifies it)
#   npm      → agent packages via npm trusted publishing (opt-in: repo variable NPM_PUBLISH=true)
#   desktop  → Windows / macOS / Linux installers + auto-update manifests
#              (unsigned unless signing secrets are set; opt-out: DESKTOP_RELEASE=false)
#
# Triggered by release-please (workflow_call), by publishing a GitHub Release
# by hand, or manually for a rebuild of an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.4.0
        required: true

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  # Product/image name — changes once with the rebrand.
  IMAGE_NAME_PREFIX: dreamward
  # CI never needs the Electron binary (electron-builder fetches its own copy).
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: v
        name: Versions match the tag
        run: |
          node scripts/release/sync-versions.mjs --check
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then echo "::error::package.json is $version but the tag is $TAG"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: pnpm -r typecheck
      - run: pnpm build
      - run: pnpm --filter @dreamward/api test

  images:
    needs: verify
    # Publishing jobs run only from main or a v* tag (repo environment "release").
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ needs.verify.outputs.prerelease == 'false' && !startsWith(env.TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=next,enable=${{ needs.verify.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.app }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  assets:
    needs: [verify, images]
    # Publishing jobs run only from main or a v* tag (repo environment "release").
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Pin the images by digest in the release compose file
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; v="${TAG#v}"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          api=$(digest "ghcr.io/$owner/$IMAGE_NAME_PREFIX-api:$v")
          web=$(digest "ghcr.io/$owner/$IMAGE_NAME_PREFIX-web:$v")
          caddy_ref=$(sed -n 's/^ *image: \(caddy:[^ ]*\).*/\1/p' deploy/docker-compose.yml)
          caddy=$(digest "docker.io/library/$caddy_ref")
          mkdir -p out
          cp deploy/install.sh deploy/Caddyfile deploy/dreamward-ctl out/
          # GitHub renames dot-files on upload; publish it under its final name.
          cp deploy/.env.example out/default.env.example
          sed -E \
            -e "s#(-api):\\\$\{DREAMWARD_VERSION[^}]*\}#\1:$v@$api#" \
            -e "s#(-web):\\\$\{DREAMWARD_VERSION\}#\1:$v@$web#" \
            -e "s#image: $caddy_ref\$#image: $caddy_ref@$caddy#" \
            deploy/docker-compose.yml > out/docker-compose.yml
          grep -n 'image:' out/docker-compose.yml
          [ "$(grep -c '@sha256:' out/docker-compose.yml)" = 3 ] || { echo "::error::expected 3 digest-pinned images"; exit 1; }
      - name: Attach self-host files to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" out/* --clobber

  npm:
    needs: [verify]
    if: vars.NPM_PUBLISH == 'true'
    # Publishing jobs run only from main or a v* tag (repo environment "release").
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/{client,mcp,cli}" build
      # Trusted publishing (OIDC): npm exchanges this job's GitHub identity for a
      # short-lived publish token, so no long-lived npm token is needed. It
      # needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - name: Publish agent packages
        env:
          # Fallback only until trusted publishing is configured on npmjs.com;
          # delete the NPM_TOKEN secret afterwards (docs/releasing.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dist_tag=latest
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && dist_tag=next
          # pnpm pack turns workspace:* dependencies into real versions; npm publishes.
          out="$RUNNER_TEMP/pkgs"; mkdir -p "$out"
          for pkg in client mcp cli; do
            tarball=$(cd "packages/$pkg" && pnpm pack --pack-destination "$out" | tail -1)
            npm publish "$tarball" --access public --tag "$dist_tag" --provenance
          done

  desktop:
    needs: [verify]
    if: vars.DESKTOP_RELEASE != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest # arm64 runner; builds arm64 + x64
            target: --mac
          - os: ubuntu-latest
            target: --linux
    # Publishing jobs run only from main or a v* tag (repo environment "release").
    environment: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@dreamward/desktop...
      - name: Package
        shell: bash
        env:
          # Code signing is optional — without these the builds are unsigned
          # (Windows SmartScreen / macOS Gatekeeper will warn). See docs/desktop.md.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/package.mjs ${{ matrix.target }}
      - name: Attach installers + update manifests to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop/release
          shopt -s nullglob
          files=( *.exe *.dmg *.zip *.AppImage *.deb *.blockmap latest*.yml )
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # One SHA256SUMS for everything on the Release (installers, self-host files).
  # install.sh and dreamward-ctl verify their downloads against it.
  checksums:
    needs: [assets, desktop]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$TAG" ../SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Refresh dreamward.life so its download buttons point at the new installers.
  site:
    needs: [desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Hand-published releases also deploy the maintainer's own instance (opt-in).
  # (release-please releases deploy from release-please.yml instead.)
  deploy-own:
    needs: [images]
    if: github.event_name == 'release' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-own.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      packages: read
    secrets: inherit
