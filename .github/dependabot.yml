version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: monthly
    # The runtime follows Node LTS lines; majors are bumped deliberately.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: build
